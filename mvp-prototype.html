&lt;script&gt;
  (function () {
    const root = document.getElementById(&#x27;xe615-prototype&#x27;);
    const names = {
      1: &#x27;01 · 连接 GitHub&#x27;,
      2: &#x27;02 · 选择单一仓库&#x27;,
      3: &#x27;03 · 同步与时间建议&#x27;,
      4: &#x27;04 · 全部待办&#x27;,
      5: &#x27;05 · 任务详情&#x27;,
      6: &#x27;06 · 今日计划&#x27;,
      7: &#x27;07 · 自动重排&#x27;,
      8: &#x27;08 · 硬截止容量冲突&#x27;
    };

    function showScreen(number) {
      root.querySelectorAll(&#x27;[data-screen]&#x27;).forEach((screen) =&gt; {
        screen.classList.toggle(&#x27;is-active&#x27;, screen.dataset.screen === String(number));
      });
      root.querySelectorAll(&#x27;[data-screen-tab]&#x27;).forEach((button) =&gt; {
        const selected = button.dataset.screenTab === String(number);
        button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
      });
      root.querySelector(&#x27;#current-screen-label&#x27;).textContent = names[number];
      root.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
    }

    root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
      const target = event.target.closest(&#x27;[data-go], [data-screen-tab]&#x27;);
      if (!target || !root.contains(target)) return;
      const next = target.dataset.go || target.dataset.screenTab;
      showScreen(Number(next));
    });

    const repoSearch = root.querySelector(&#x27;#repo-search&#x27;);
    repoSearch.addEventListener(&#x27;input&#x27;, () =&gt; {
      const query = repoSearch.value.trim().toLowerCase();
      root.querySelectorAll(&#x27;[data-repo-name]&#x27;).forEach((row) =&gt; {
        row.hidden = query &amp;&amp; !row.dataset.repoName.toLowerCase().includes(query);
      });
    });

    root.querySelectorAll(&#x27;input[name=&quot;repo&quot;]&#x27;).forEach((radio) =&gt; {
      radio.addEventListener(&#x27;change&#x27;, () =&gt; {
        root.querySelector(&#x27;#selected-repo&#x27;).textContent = radio.value;
      });
    });

    let pendingSuggestions = 2;
    function finishSuggestion(id, value) {
      const row = root.querySelector(`[data-suggestion=&quot;${id}&quot;]`);
      row.querySelector(&#x27;.default-suggestion-actions&#x27;).classList.add(&#x27;hidden&#x27;);
      row.querySelector(`[data-editor=&quot;${id}&quot;]`).classList.remove(&#x27;is-open&#x27;);
      const accepted = row.querySelector(`[data-accepted=&quot;${id}&quot;]`);
      accepted.querySelector(&#x27;span&#x27;).textContent = `已设为 ${value}`;
      if (!accepted.classList.contains(&#x27;is-shown&#x27;)) pendingSuggestions -= 1;
      accepted.classList.add(&#x27;is-shown&#x27;);
      root.querySelector(&#x27;#suggestion-count&#x27;).textContent = pendingSuggestions ? `${pendingSuggestions} 项待确认` : &#x27;已全部确认&#x27;;
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }

    root.querySelectorAll(&#x27;[data-accept-estimate]&#x27;).forEach((button) =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; finishSuggestion(button.dataset.acceptEstimate, button.dataset.estimate));
    });

    root.querySelectorAll(&#x27;[data-edit-estimate]&#x27;).forEach((button) =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const id = button.dataset.editEstimate;
        root.querySelector(`[data-suggestion=&quot;${id}&quot;] .default-suggestion-actions`).classList.add(&#x27;hidden&#x27;);
        root.querySelector(`[data-editor=&quot;${id}&quot;]`).classList.add(&#x27;is-open&#x27;);
      });
    });

    root.querySelectorAll(&#x27;[data-save-estimate]&#x27;).forEach((button) =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const id = button.dataset.saveEstimate;
        const value = root.querySelector(`[data-editor=&quot;${id}&quot;] input`).value.trim() || &#x27;待估算&#x27;;
        finishSuggestion(id, value);
      });
    });

    root.querySelector(&#x27;#save-planning&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showScreen(7));

    const capacityForm = root.querySelector(&#x27;#capacity-form&#x27;);
    const removeForm = root.querySelector(&#x27;#remove-form&#x27;);
    const result = root.querySelector(&#x27;#resolution-result&#x27;);
    root.querySelectorAll(&#x27;[data-resolution]&#x27;).forEach((button) =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        capacityForm.classList.toggle(&#x27;is-shown&#x27;, button.dataset.resolution === &#x27;capacity&#x27;);
        removeForm.classList.toggle(&#x27;is-shown&#x27;, button.dataset.resolution === &#x27;remove&#x27;);
        result.classList.remove(&#x27;is-shown&#x27;);
        if (button.dataset.resolution === &#x27;delay&#x27;) {
          root.querySelector(&#x27;#resolution-message&#x27;).textContent = &#x27;已记录你接受可能延期；冲突标识将继续保留。&#x27;;
          result.classList.add(&#x27;is-shown&#x27;);
        }
      });
    });

    root.querySelectorAll(&#x27;[data-confirm-resolution]&#x27;).forEach((button) =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;#resolution-message&#x27;).textContent = button.dataset.confirmResolution;
        result.classList.add(&#x27;is-shown&#x27;);
      });
    });
  })();
&lt;/script&gt;
