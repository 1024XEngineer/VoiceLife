<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日程助手 · IM 回执</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">VOICE CALENDAR</p>
          <h1>日程助手</h1>
          <p class="subtitle">这里仅保留语音操作的消息回执</p>
        </div>
        <span id="connection" class="connection">连接中</span>
      </header>

      <section class="demo-panel" aria-labelledby="demo-title">
        <div>
          <p class="eyebrow">DEMO CLOCK</p>
          <h2 id="demo-title">演示时间</h2>
          <p id="clock" class="clock">--</p>
        </div>
        <div class="clock-actions">
          <button data-advance="1">+1 分钟</button>
          <button data-advance="10">+10 分钟</button>
          <button data-advance="60">+1 小时</button>
          <button id="reset-clock" class="secondary">恢复现在</button>
        </div>
        <form id="set-clock" class="clock-form">
          <label for="clock-input">设置到指定时间</label>
          <div>
            <input id="clock-input" type="datetime-local" required />
            <button type="submit">设置</button>
          </div>
        </form>
      </section>

      <section class="message-section" aria-labelledby="messages-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">RECEIPTS</p>
            <h2 id="messages-title">消息回执</h2>
          </div>
          <button id="refresh" class="secondary">刷新</button>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="empty" class="empty">
          <p>还没有回执</p>
          <span>请先在灵矽 Web Demo 中用语音创建一条日程。</span>
        </div>
      </section>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
