name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  im-gateway-tests:
    name: IM Gateway / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: 配置 Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 固定 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version
      - name: 安装冻结依赖
        run: pnpm --dir services/im-gateway install --frozen-lockfile
      - name: 检查契约与类型
        run: pnpm --dir services/im-gateway check
      - name: 运行共享 fixture 与状态机测试
        run: pnpm --dir services/im-gateway test

  host-tests:
    name: 主机测试与架构边界
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 记录 Runner 环境
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          cmake --version | head -n 1
          python3 --version
      - name: 检查提交描述
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_commit_message.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: 运行快速质量门禁
        run: ./scripts/run_checks.sh

  esp-idf-build:
    name: ESP-IDF 6.0 / ESP32-S3
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: 构建固件骨架
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: .
