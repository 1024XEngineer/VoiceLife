name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: 工作流语法检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 安装 actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: 检查工作流
        run: actionlint .github/workflows/*.yml

  format:
    name: 格式与 Python 静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 安装格式检查工具
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format-18
          python -m pip install --disable-pip-version-check "ruff==0.12.7"
      - name: 检查代码格式与 Python 静态规则
        run: CLANG_FORMAT=clang-format-18 ./scripts/check_format.sh

  im-gateway-tests:
    name: IM Gateway / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://voicelife:voicelife@localhost:5432/voicelife
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voicelife
          POSTGRES_PASSWORD: voicelife
          POSTGRES_DB: voicelife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicelife -d voicelife" --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 配置 Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: 固定 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version
      - name: 安装冻结依赖
        run: pnpm --dir services/im-gateway install --frozen-lockfile
      - name: 检查格式、静态规则、类型与测试
        run: pnpm --dir services/im-gateway run ci
      - name: 运行 Host 强提醒系统 E2E
        run: |
          mkdir -p artifacts/im-gateway-e2e
          python3 scripts/run_e2e.py \
            --layer host \
            --journey im-gateway-strong-reminder \
            --profile host \
            --artifact-dir artifacts/im-gateway-e2e \
            --timeout 60
      - name: 运行 Host 快速恢复 E2E
        run: |
          E2E_RECOVERY_SUITE=quick python3 scripts/run_e2e.py \
            --layer host \
            --journey im-gateway-recovery \
            --profile host \
            --artifact-dir artifacts/im-gateway-e2e \
            --timeout 120 \
            --retries 0
      - name: 上传 Host E2E 脱敏证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: im-gateway-host-e2e-evidence
          path: artifacts/im-gateway-e2e
          if-no-files-found: ignore

  coverage:
    name: 覆盖率（Codecov）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://voicelife:voicelife@localhost:5432/voicelife
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voicelife
          POSTGRES_PASSWORD: voicelife
          POSTGRES_DB: voicelife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicelife -d voicelife" --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: 安装覆盖率工具
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev
          python -m pip install --disable-pip-version-check "gcovr==8.5"
      - name: 生成 C++ 覆盖率报告
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          cmake -S tests/host -B build-coverage -DVOICELIFE_ENABLE_COVERAGE=ON -DCMAKE_CXX_COMPILER=g++
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure
          # Exclude both the repository-level tests/ tree and component-level test/ trees.
          # The components filter otherwise includes files such as components/*/test/*.cc.
          gcovr --root . --filter components --exclude 'components/.*/test/.*' --exclude 'components/.*/tests/.*' --gcov-ignore-parse-errors negative_hits.warn --xml-pretty -o coverage/cpp.xml
      - name: 生成 Gateway 覆盖率报告
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --dir services/im-gateway install --frozen-lockfile
          pnpm --dir services/im-gateway run coverage
      - name: 上传 C++ 覆盖率报告
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage/cpp.xml
          flags: cpp
          fail_ci_if_error: true
          verbose: true
      - name: 上传 TypeScript 覆盖率报告
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: services/im-gateway/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: true
          verbose: true

  host-tests:
    name: 主机测试与架构边界
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 记录 Runner 环境
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          cmake --version | head -n 1
          python3 --version
      - name: 安装 SQLite 开发库
        run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev
      - name: 检查提交描述
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: python3 scripts/check_commit_message.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: 运行快速质量门禁
        run: ./scripts/run_checks.sh
      - name: 检查变更源码规模
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_code_size.py --base "${{ github.event.pull_request.base.sha }}"

  esp-idf-build:
    name: ESP-IDF 6.0 / ESP32-S3
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 准备固定版本 SQLite 源码
        run: python3 scripts/prepare_sqlite.py
      - name: 构建默认固件骨架
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: .
      - name: 构建 Timing ESP Unity 测试固件
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: tests/board/timing_esp_unity
      - name: 构建 FATFS/WL + SQLite 存储 Profile
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: .
          command: python3 scripts/firmware.py build esp32s3-storage-dev
