name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: 工作流语法检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 安装 actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: 检查工作流
        run: actionlint .github/workflows/*.yml

  format:
    name: 格式与 Python 静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: 安装格式检查工具
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-format-18
          python -m pip install --disable-pip-version-check "ruff==0.12.7"
      - name: 检查代码格式与 Python 静态规则
        run: CLANG_FORMAT=clang-format-18 ./scripts/check_format.sh

  im-gateway-tests:
    name: IM Gateway / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 配置 Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: 固定 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version
      - name: 安装冻结依赖
        run: pnpm --dir services/im-gateway install --frozen-lockfile
      - name: 检查格式、静态规则、类型与测试
        run: pnpm --dir services/im-gateway run ci

  coverage:
    name: 覆盖率（Codecov）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: 安装覆盖率工具
        run: python -m pip install --disable-pip-version-check "gcovr==8.5"
      - name: 生成 C++ 覆盖率报告
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          cmake -S tests/host -B build-coverage -DVOICELIFE_ENABLE_COVERAGE=ON -DCMAKE_CXX_COMPILER=g++
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure
          gcovr --root . --filter components --exclude tests --xml-pretty -o coverage/cpp.xml
      - name: 生成 Gateway 覆盖率报告
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --dir services/im-gateway install --frozen-lockfile
          pnpm --dir services/im-gateway run coverage
      - name: 上传 C++ 覆盖率报告
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: coverage/cpp.xml
          flags: cpp
          fail_ci_if_error: true
          verbose: true
      - name: 上传 TypeScript 覆盖率报告
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: services/im-gateway/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: true
          verbose: true

  host-tests:
    name: 主机测试与架构边界
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: 记录 Runner 环境
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          cmake --version | head -n 1
          python3 --version
      - name: 检查提交描述
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_commit_message.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: 运行快速质量门禁
        run: ./scripts/run_checks.sh
      - name: 检查变更源码规模
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_code_size.py --base "${{ github.event.pull_request.base.sha }}"

  esp-idf-build:
    name: ESP-IDF 6.0 / ESP32-S3
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 构建固件骨架
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: .
