name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: 依赖变更审查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 检查 Dependency Graph
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /dev/null \
            --write-out "%{http_code}" \
            "https://api.github.com/repos/${REPOSITORY}/dependency-graph/sbom")"
          case "${status}" in
            200)
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::Dependency Graph 未启用，暂跳过 Dependency Review；请仓库管理员在 Settings > Security & analysis 中启用。"
              ;;
            *)
              echo "Dependency Graph 探测失败（HTTP ${status}），不能确认依赖审查能力。" >&2
              exit 1
              ;;
          esac
      - name: 运行依赖变更审查
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      - name: 记录依赖审查跳过原因
        if: steps.dependency-graph.outputs.enabled != 'true'
        run: echo "Dependency Graph 尚未启用，本次只记录跳过原因；启用后将执行真实依赖审查。"

  codeql:
    name: CodeQL（${{ matrix.id }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: cpp
            language: cpp
            build-mode: manual
          - id: python
            language: python
            build-mode: none
          - id: typescript
            language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: 安装 SQLite 开发库
        if: matrix.id == 'cpp'
        shell: bash
        run: |
          set -euo pipefail

          # GitHub 托管 Runner 通常已预装该依赖，避免无必要地访问外部软件源。
          if dpkg-query --show --showformat='${Status}\n' libsqlite3-dev 2>/dev/null \
            | grep --quiet '^install ok installed$'; then
            echo "libsqlite3-dev 已安装，跳过 APT 更新。"
            exit 0
          fi

          # 软件源异常时在 3 分钟内明确失败，避免 CodeQL job 一直等待到总超时。
          sudo timeout --kill-after=15s 3m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo timeout --kill-after=15s 3m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install --yes libsqlite3-dev
      - name: 构建主机 C++ 测试
        if: matrix.id == 'cpp'
        run: ./scripts/run_host_tests.sh
      - name: 安装并构建 IM Gateway
        if: matrix.id == 'typescript'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.17.1
      - name: 设置 Node.js
        if: matrix.id == 'typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/im-gateway/pnpm-lock.yaml
      - name: 运行 IM Gateway 构建
        if: matrix.id == 'typescript'
        working-directory: services/im-gateway
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
