name: IM Recovery Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: Optional recovery scenario name
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: im-recovery-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-matrix:
    name: IM Gateway recovery matrix / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://voicelife:voicelife@localhost:5432/voicelife
      E2E_RECOVERY_SUITE: full
      E2E_RECOVERY_SCENARIO: ${{ inputs.scenario || '' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voicelife
          POSTGRES_PASSWORD: voicelife
          POSTGRES_DB: voicelife
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: 固定 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
      - name: 安装冻结依赖
        run: pnpm --dir services/im-gateway install --frozen-lockfile
      - name: 运行完整恢复矩阵
        run: |
          mkdir -p artifacts/im-gateway-recovery
          python3 scripts/run_e2e.py \
            --layer host \
            --journey im-gateway-recovery \
            --profile host \
            --artifact-dir artifacts/im-gateway-recovery \
            --timeout 300 \
            --retries 0
      - name: 上传恢复矩阵脱敏证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: im-gateway-recovery-nightly-evidence
          path: artifacts/im-gateway-recovery
          if-no-files-found: ignore
