coverage:
  status:
    project:
      cpp:
        flags:
          - cpp
        target: 80%
        threshold: 0%
      typescript:
        flags:
          - typescript
        target: 80%
        threshold: 0%
    patch:
      cpp:
        flags:
          - cpp
        target: 80%
        threshold: 0%
        paths:
          - "components/**"
      typescript:
        flags:
          - typescript
        target: 80%
        threshold: 0%
        paths:
          - "services/im-gateway/src/**"

comment:
  layout: "diff, flags, files"
  require_changes: true

ignore:
  # 第三方源码由上游维护，不纳入项目覆盖率统计。
  - "third_party/**"
  - "tests/**"
  # Component-local test sources are not production code and are not included
  # in the gcovr C++ report consistently across host targets.
  - "components/voicelife_mcp/test/**"
  # This header-only predicate is exercised by the serial protocol contract
  # test, but gcovr cannot attribute its inline instantiation reliably.
  - "components/voicelife_runtime/src/serial_voice_protocol.h"
  - "services/im-gateway/test/**"
  # Executable entrypoints are covered by smoke and integration tests, not by
  # the product source-coverage denominator.
  - "services/im-gateway/scripts/**"
  - "main/**"
  # 语音模块仍在开发中,实板验证与 host 覆盖率补齐前暂缓计入 codecov。
  - "components/voicelife_voice/**"
  - "components/voicelife_linx/**"
  - "components/voicelife_linx_esp/**"
  - "components/voicelife_audio_esp/**"
  # ESP_PLATFORM-only FreeRTOS runtime; host gcov cannot execute this target-specific code.
  - "components/voicelife_timing_esp/**"
