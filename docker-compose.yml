services:
  postgres:
    image: postgres:16-alpine
    container_name: voicelife-postgres
    environment:
      POSTGRES_USER: voicelife
      POSTGRES_PASSWORD: voicelife
      POSTGRES_DB: voicelife
    ports:
      - "5432:5432"
    volumes:
      - voicelife_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicelife -d voicelife"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  voicelife_postgres_data:
